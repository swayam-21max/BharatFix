version: '3.8'

services:
  app:
    build: ./server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - db
    networks:
      - bharatfix-network

  db:
    image: postgis/postgis:15-3.3-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bharatfix
    ports:
      - "5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - bharatfix-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - bharatfix-network

networks:
  bharatfix-network:
    driver: bridge

volumes:
  pg-data:
